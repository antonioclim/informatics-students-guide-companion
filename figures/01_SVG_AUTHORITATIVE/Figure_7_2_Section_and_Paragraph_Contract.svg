<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="900" viewBox="0 0 1650 900" role="img" aria-labelledby="title desc">
  <title id="title">Section contract and paragraph reasoning test</title>
  <desc id="desc">A five-step section contract runs from promise through evidence set, reasoning and boundary to return. A separate four-step paragraph test runs from claim through evidence and reasoning to a limit or hand-off. Two notes state that a section earns its place only when the next step depends on what it establishes and that a citation or result beside a claim is insufficient without a visible reasoning link and boundary.</desc>
  <defs>
    <style><![CDATA[
      .bluebox { fill:#e9eff6; stroke:#294f7c; stroke-width:4; }
      .note { fill:#fffafa; stroke:#9e2e2e; stroke-width:4; }
      .h1 { font-family:'Times New Roman',serif; font-weight:700; font-size:31px; fill:#203a5d; letter-spacing:.6px; }
      .boxhead { font-family:'Times New Roman',serif; font-weight:700; font-size:25px; fill:#203a5d; }
      .boxheadsmall { font-family:'Times New Roman',serif; font-weight:700; font-size:22px; fill:#203a5d; }
      .boxsub { font-family:'Times New Roman',serif; font-size:20px; fill:#526d8b; }
      .notemain { font-family:'Times New Roman',serif; font-weight:700; font-size:26px; fill:#7f2525; }
      .notesub { font-family:'Times New Roman',serif; font-style:italic; font-size:21px; fill:#526d8b; }
      .flow { stroke:#2a527e; stroke-width:4; fill:none; }
    ]]></style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#2a527e"/></marker>
  </defs>
  <rect width="1650" height="900" fill="#fff"/>
  <text x="825" y="50" text-anchor="middle" class="h1">SECTION CONTRACT</text>

  <g>
    <rect x="35" y="89" width="289" height="151" rx="18" class="bluebox"/>
    <text x="179.5" y="147" text-anchor="middle" class="boxhead">PROMISE</text>
    <text x="179.5" y="193" text-anchor="middle" class="boxsub">what must be established</text>
    <path d="M328 164 L352 164" class="flow" marker-end="url(#arrow)"/>

    <rect x="358" y="89" width="289" height="151" rx="18" class="bluebox"/>
    <text x="502.5" y="147" text-anchor="middle" class="boxhead">EVIDENCE SET</text>
    <text x="502.5" y="193" text-anchor="middle" class="boxsub">authorised material</text>
    <path d="M651 164 L675 164" class="flow" marker-end="url(#arrow)"/>

    <rect x="681" y="89" width="289" height="151" rx="18" class="bluebox"/>
    <text x="825.5" y="147" text-anchor="middle" class="boxhead">REASONING</text>
    <text x="825.5" y="193" text-anchor="middle" class="boxsub">why the evidence bears</text>
    <path d="M974 164 L998 164" class="flow" marker-end="url(#arrow)"/>

    <rect x="1004" y="89" width="289" height="151" rx="18" class="bluebox"/>
    <text x="1148.5" y="147" text-anchor="middle" class="boxhead">BOUNDARY</text>
    <text x="1148.5" y="193" text-anchor="middle" class="boxsub">what remains unresolved</text>
    <path d="M1297 164 L1321 164" class="flow" marker-end="url(#arrow)"/>

    <rect x="1327" y="89" width="289" height="151" rx="18" class="bluebox"/>
    <text x="1471.5" y="147" text-anchor="middle" class="boxhead">RETURN</text>
    <text x="1471.5" y="193" text-anchor="middle" class="boxsub">what now follows</text>
  </g>

  <rect x="150" y="290" width="1350" height="97" rx="17" class="note"/>
  <text x="825" y="329" text-anchor="middle" class="notemain">A section earns its place when the next step depends on what it has established.</text>
  <text x="825" y="365" text-anchor="middle" class="notesub">If its removal changes nothing essential, merge, move or delete it.</text>

  <text x="825" y="457" text-anchor="middle" class="h1">PARAGRAPH REASONING TEST</text>

  <g>
    <rect x="82" y="496" width="320" height="149" rx="18" class="bluebox"/>
    <text x="242" y="553" text-anchor="middle" class="boxhead">CLAIM</text>
    <text x="242" y="598" text-anchor="middle" class="boxsub">contestable proposition</text>
    <path d="M406 570 L461 570" class="flow" marker-end="url(#arrow)"/>

    <rect x="471" y="496" width="320" height="149" rx="18" class="bluebox"/>
    <text x="631" y="553" text-anchor="middle" class="boxhead">EVIDENCE</text>
    <text x="631" y="598" text-anchor="middle" class="boxsub">source, result or record</text>
    <path d="M795 570 L850 570" class="flow" marker-end="url(#arrow)"/>

    <rect x="860" y="496" width="320" height="149" rx="18" class="bluebox"/>
    <text x="1020" y="553" text-anchor="middle" class="boxhead">REASONING</text>
    <text x="1020" y="598" text-anchor="middle" class="boxsub">explicit inferential link</text>
    <path d="M1184 570 L1239 570" class="flow" marker-end="url(#arrow)"/>

    <rect x="1249" y="496" width="320" height="149" rx="18" class="bluebox"/>
    <text x="1409" y="553" text-anchor="middle" class="boxheadsmall">LIMIT OR HAND-OFF</text>
    <text x="1409" y="598" text-anchor="middle" class="boxsub">scope or next move</text>
  </g>

  <rect x="138" y="717" width="1374" height="111" rx="18" class="note"/>
  <text x="825" y="765" text-anchor="middle" class="notemain">A citation or result beside a claim is not enough.</text>
  <text x="825" y="804" text-anchor="middle" class="notesub">The reasoning link and the boundary must remain visible to the reader.</text>
</svg>
