<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1005" viewBox="0 0 1800 1005">
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs><rect width="1800" height="1005" fill="white"/><text x="900" y="48" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="28" font-style="italic">a defensible commitment remains reversible until evidence retains it</text><rect x="20" y="100" rx="17" width="300" height="185" fill="#eeeeee" stroke="#333" stroke-width="4"/><text x="170.0" y="155" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="25" font-weight="bold">EVIDENCE +</text><text x="170.0" y="188" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="25" font-weight="bold">AUTHORITY</text><text x="170.0" y="237" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="19">what is known and permitted</text><rect x="375" y="100" rx="17" width="300" height="185" fill="#eeeeee" stroke="#333" stroke-width="4"/><text x="525.0" y="155" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="25" font-weight="bold">DRIVER +</text><text x="525.0" y="188" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="25" font-weight="bold">BOUNDARY</text><text x="525.0" y="237" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="19">why it matters and what is fixed</text><rect x="730" y="100" rx="17" width="300" height="185" fill="#eeeeee" stroke="#333" stroke-width="4"/><text x="880.0" y="155" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="25" font-weight="bold">CRITERIA</text><text x="880.0" y="222" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="19">how options will be judged</text><rect x="1085" y="100" rx="17" width="300" height="185" fill="#eeeeee" stroke="#333" stroke-width="4"/><text x="1235.0" y="155" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="25" font-weight="bold">CREDIBLE</text><text x="1235.0" y="188" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="25" font-weight="bold">ALTERNATIVES</text><text x="1235.0" y="237" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="19">including the simpler baseline</text><rect x="1440" y="100" rx="17" width="300" height="185" fill="#eeeeee" stroke="#333" stroke-width="4"/><text x="1590.0" y="155" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="25" font-weight="bold">TRADE-OFF</text><text x="1590.0" y="222" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="19">accepted gain and loss</text><line x1="325" y1="193" x2="365" y2="193" stroke="#444" stroke-width="4" marker-end="url(#arr)"/><line x1="680" y1="193" x2="720" y2="193" stroke="#444" stroke-width="4" marker-end="url(#arr)"/><line x1="1035" y1="193" x2="1075" y2="193" stroke="#444" stroke-width="4" marker-end="url(#arr)"/><line x1="1390" y1="193" x2="1430" y2="193" stroke="#444" stroke-width="4" marker-end="url(#arr)"/><rect x="45" y="515" rx="17" width="390" height="190" fill="#d9d9d9" stroke="#333" stroke-width="4"/><text x="240.0" y="573" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="26" font-weight="bold">EVALUATION</text><text x="240.0" y="606" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="26" font-weight="bold">RESULT</text><text x="240.0" y="655" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="19">retain, qualify or reopen</text><rect x="475" y="515" rx="17" width="390" height="190" fill="#d9d9d9" stroke="#333" stroke-width="4"/><text x="670.0" y="573" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="26" font-weight="bold">EARLY TEST</text><text x="670.0" y="641" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="19">challenge the highest-risk assumption</text><rect x="905" y="515" rx="17" width="390" height="190" fill="#d9d9d9" stroke="#333" stroke-width="4"/><text x="1100.0" y="573" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="26" font-weight="bold">PROTOCOL /</text><text x="1100.0" y="606" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="26" font-weight="bold">ARTEFACT</text><text x="1100.0" y="655" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="19">committed procedure or design</text><rect x="1335" y="515" rx="17" width="390" height="190" fill="#d9d9d9" stroke="#333" stroke-width="4"/><text x="1530.0" y="573" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="26" font-weight="bold">DECISION +</text><text x="1530.0" y="606" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="26" font-weight="bold">TRIGGER</text><text x="1530.0" y="655" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="19">selected option and reopening rule</text><path d="M1590 295 L1590 455 L1530 500" fill="none" stroke="#444" stroke-width="4" marker-end="url(#arr)"/><line x1="1330" y1="610" x2="1300" y2="610" stroke="#444" stroke-width="4" marker-end="url(#arr)"/><line x1="900" y1="610" x2="870" y2="610" stroke="#444" stroke-width="4" marker-end="url(#arr)"/><line x1="470" y1="610" x2="440" y2="610" stroke="#444" stroke-width="4" marker-end="url(#arr)"/><path d="M220 710 L220 810 C220 870 440 875 455 800 L455 350 C455 320 480 300 505 292" fill="none" stroke="#777" stroke-width="4" stroke-dasharray="13,10" marker-end="url(#arr)"/><text x="900" y="950" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="27" font-style="italic">a failed test or changed authority reopens the upstream commitment</text></svg>