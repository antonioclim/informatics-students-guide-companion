<text x="900" y="385" text-anchor="middle" font-family="Times New Roman, serif" font-size="42" font-weight="bold">STUDENT</text>
<text x="900" y="445" text-anchor="middle" font-family="Times New Roman, serif" font-size="29">owns authorship and the submitted record</text>
<text x="900" y="500" text-anchor="middle" font-family="Times New Roman, serif" font-size="29">executes, verifies and explains the work</text>
<text x="900" y="555" text-anchor="middle" font-family="Times New Roman, serif" font-size="29">records consequential decisions and changes</text>
<text x="900" y="610" text-anchor="middle" font-family="Times New Roman, serif" font-size="29">defends the evidence and its limits</text>
<text x="900" y="105" text-anchor="middle" font-family="Times New Roman, serif" font-size="40" font-weight="bold">SUPERVISOR</text>
<text x="900" y="155" text-anchor="middle" font-family="Times New Roman, serif" font-size="28">advice, challenge and academic approval</text>
<text x="900" y="198" text-anchor="middle" font-family="Times New Roman, serif" font-size="28">within programme rules and agreed scope</text>
<text x="245" y="410" text-anchor="middle" font-family="Times New Roman, serif" font-size="37" font-weight="bold">INSTITUTIONAL</text>
<text x="245" y="455" text-anchor="middle" font-family="Times New Roman, serif" font-size="37" font-weight="bold">AUTHORITY</text>
<text x="245" y="520" text-anchor="middle" font-family="Times New Roman, serif" font-size="27">rules, integrity and assessment</text>
<text x="245" y="565" text-anchor="middle" font-family="Times New Roman, serif" font-size="27">submission and formal decisions</text>
<text x="1555" y="410" text-anchor="middle" font-family="Times New Roman, serif" font-size="37" font-weight="bold">EXTERNAL</text>
<text x="1555" y="455" text-anchor="middle" font-family="Times New Roman, serif" font-size="37" font-weight="bold">ORGANISATION</text>
<text x="1555" y="500" text-anchor="middle" font-family="Times New Roman, serif" font-size="23">context and access</text>
<text x="1555" y="535" text-anchor="middle" font-family="Times New Roman, serif" font-size="23">practical constraints</text>
<text x="1555" y="570" text-anchor="middle" font-family="Times New Roman, serif" font-size="23">no academic authority</text>
<text x="1555" y="605" text-anchor="middle" font-family="Times New Roman, serif" font-size="23">over the claim</text>
<text x="900" y="810" text-anchor="middle" font-family="Times New Roman, serif" font-size="40" font-weight="bold">AI TOOL</text>
<text x="900" y="865" text-anchor="middle" font-family="Times New Roman, serif" font-size="27">candidate assistance subject to verification</text>
<text x="900" y="908" text-anchor="middle" font-family="Times New Roman, serif" font-size="27">no approval, authorship or responsibility</text>
