<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980">
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#284d7a"/></marker></defs><rect width="1800" height="980" fill="white"/><rect x="1115" y="24" width="635" height="86" rx="16" fill="#fff7f3" stroke="#9b3b2f" stroke-width="4"/><text x="1432" y="76" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="28" fill="#7c3027" font-style="italic">stop before external or irreversible action</text><rect x="655" y="355" width="490" height="250" rx="26" fill="#eef1f4" stroke="#3d4b58" stroke-width="5"/><text x="900" y="430" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="36" fill="#1f2d3d" font-weight="bold">ONE CONSEQUENTIAL</text><text x="900" y="477" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="36" fill="#1f2d3d" font-weight="bold">WORK UNIT</text><text x="900" y="530" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="23" fill="#536272" font-style="italic">authority + state + inspection</text><text x="900" y="566" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="23" fill="#536272" font-style="italic">+ disposition + recovery</text><rect x="665" y="95" width="470" height="170" rx="18" fill="#e8eef5" stroke="#284d7a" stroke-width="4"/><text x="900.0" y="163" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="29" fill="#1f2d3d" font-weight="bold">AUTHORISE + BOUND</text><text x="900.0" y="211" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="21" fill="#42566d" font-style="italic">purpose, non-goals, criteria</text><rect x="1240" y="220" width="440" height="170" rx="18" fill="#e8eef5" stroke="#284d7a" stroke-width="4"/><text x="1460.0" y="288" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="29" fill="#1f2d3d" font-weight="bold">FREEZE STATE</text><text x="1460.0" y="336" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="21" fill="#42566d" font-style="italic">identity, permissions, limits</text><rect x="1260" y="620" width="420" height="170" rx="18" fill="#e8eef5" stroke="#284d7a" stroke-width="4"/><text x="1470.0" y="688" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="29" fill="#1f2d3d" font-weight="bold">PRODUCE</text><text x="1470.0" y="736" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="21" fill="#42566d" font-style="italic">candidate work</text><rect x="665" y="725" width="470" height="170" rx="18" fill="#e8eef5" stroke="#284d7a" stroke-width="4"/><text x="900.0" y="793" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="29" fill="#1f2d3d" font-weight="bold">INSPECT</text><text x="900.0" y="841" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="21" fill="#42566d" font-style="italic">primary artefact + checks</text><rect x="120" y="620" width="430" height="170" rx="18" fill="#e8eef5" stroke="#284d7a" stroke-width="4"/><text x="335.0" y="688" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="29" fill="#1f2d3d" font-weight="bold">DISPOSITION</text><text x="335.0" y="736" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="21" fill="#42566d" font-style="italic">accept, repair, reject or stop</text><rect x="120" y="220" width="430" height="170" rx="18" fill="#e8eef5" stroke="#284d7a" stroke-width="4"/><text x="335.0" y="288" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="29" fill="#1f2d3d" font-weight="bold">RECORD + RECOVER</text><text x="335.0" y="336" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="21" fill="#42566d" font-style="italic">version, failure, condition</text><path d="M1135 180 C1215 180 1245 210 1270 245" fill="none" stroke="#284d7a" stroke-width="5" marker-end="url(#arr)"/><path d="M1680 390 C1735 470 1730 570 1665 630" fill="none" stroke="#284d7a" stroke-width="5" marker-end="url(#arr)"/><path d="M1260 705 C1185 755 1155 790 1125 805" fill="none" stroke="#284d7a" stroke-width="5" marker-end="url(#arr)"/><path d="M665 810 C600 810 565 790 540 755" fill="none" stroke="#284d7a" stroke-width="5" marker-end="url(#arr)"/><path d="M300 620 C235 545 235 470 300 390" fill="none" stroke="#284d7a" stroke-width="5" marker-end="url(#arr)"/><path d="M550 245 C585 205 625 185 665 180" fill="none" stroke="#284d7a" stroke-width="5" marker-end="url(#arr)"/><line x1="900" y1="265" x2="900" y2="345" stroke="#8a98a8" stroke-width="3" stroke-dasharray="11,9"/><line x1="1240" y1="390" x2="1145" y2="430" stroke="#8a98a8" stroke-width="3" stroke-dasharray="11,9"/><line x1="1260" y1="705" x2="1145" y2="565" stroke="#8a98a8" stroke-width="3" stroke-dasharray="11,9"/><line x1="900" y1="725" x2="900" y2="615" stroke="#8a98a8" stroke-width="3" stroke-dasharray="11,9"/><line x1="550" y1="705" x2="655" y2="565" stroke="#8a98a8" stroke-width="3" stroke-dasharray="11,9"/><line x1="550" y1="390" x2="655" y2="430" stroke="#8a98a8" stroke-width="3" stroke-dasharray="11,9"/><rect x="425" y="918" width="950" height="48" rx="12" fill="#f6f7f8" stroke="#687b92" stroke-width="3"/><text x="900" y="951" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="25" fill="#52667f" font-style="italic">failed runs and rejected candidates remain in the record</text></svg>