</defs><rect width="1800" height="960" fill="white"/><text x="900" y="48" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="29" fill="#4c6078" font-style="italic">acceptance admits a known unit; it does not prove the thesis claim</text><rect x="35" y="105" width="300" height="180" rx="18" fill="#e8eef5" stroke="#284d7a" stroke-width="4"/><text x="185.0" y="163" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="27" fill="#1f2d3d" font-weight="bold">APPROVED</text><text x="185.0" y="201" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="27" fill="#1f2d3d" font-weight="bold">COMMITMENT</text><text x="185.0" y="248" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="19" fill="#42566d" font-style="italic">authority + boundary</text><rect x="380" y="105" width="300" height="180" rx="18" fill="#e8eef5" stroke="#284d7a" stroke-width="4"/><text x="530.0" y="163" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="27" fill="#1f2d3d" font-weight="bold">BOUNDED</text><text x="530.0" y="201" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="27" fill="#1f2d3d" font-weight="bold">WORK UNIT</text><text x="530.0" y="248" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="19" fill="#42566d" font-style="italic">purpose + non-goals</text><rect x="725" y="105" width="300" height="180" rx="18" fill="#e8eef5" stroke="#284d7a" stroke-width="4"/><text x="875.0" y="163" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="27" fill="#1f2d3d" font-weight="bold">FROZEN</text><text x="875.0" y="201" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="27" fill="#1f2d3d" font-weight="bold">STARTING STATE</text><text x="875.0" y="248" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="19" fill="#42566d" font-style="italic">identity + permissions</text><rect x="1070" y="105" width="300" height="180" rx="18" fill="#e8eef5" stroke="#284d7a" stroke-width="4"/><text x="1220.0" y="163" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="27" fill="#1f2d3d" font-weight="bold">CANDIDATE</text><text x="1220.0" y="201" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="27" fill="#1f2d3d" font-weight="bold">OUTPUT</text><text x="1220.0" y="248" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="19" fill="#42566d" font-style="italic">produced, not admitted</text><rect x="1415" y="105" width="300" height="180" rx="18" fill="#e8eef5" stroke="#284d7a" stroke-width="4"/><text x="1565.0" y="163" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="27" fill="#1f2d3d" font-weight="bold">INSPECTION +</text><text x="1565.0" y="201" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="27" fill="#1f2d3d" font-weight="bold">LOCAL CHECKS</text><text x="1565.0" y="248" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="19" fill="#42566d" font-style="italic">primary artefact + basis</text><line x1="335" y1="195" x2="370" y2="195" stroke="#284d7a" stroke-width="5" marker-end="url(#arr)"/><line x1="680" y1="195" x2="715" y2="195" stroke="#284d7a" stroke-width="5" marker-end="url(#arr)"/><line x1="1025" y1="195" x2="1060" y2="195" stroke="#284d7a" stroke-width="5" marker-end="url(#arr)"/><line x1="1370" y1="195" x2="1405" y2="195" stroke="#284d7a" stroke-width="5" marker-end="url(#arr)"/><rect x="1290" y="415" width="390" height="180" rx="18" fill="#d9e4f1" stroke="#284d7a" stroke-width="4"/><text x="1485" y="477" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="31" fill="#1f2d3d" font-weight="bold">DISPOSITION</text><text x="1485" y="520" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="21" fill="#1f2d3d">accept / condition / repair</text><text x="1485" y="553" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="21" fill="#1f2d3d">repeat / reject / quarantine</text><line x1="1565" y1="285" x2="1515" y2="405" stroke="#284d7a" stroke-width="5" marker-end="url(#arr)"/><rect x="925" y="650" width="330" height="170" rx="18" fill="#e3e8ec" stroke="#3d4b58" stroke-width="4"/><text x="1090.0" y="707" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="27" fill="#1f2d3d" font-weight="bold">ACCEPTED</text><text x="1090.0" y="744" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="27" fill="#1f2d3d" font-weight="bold">WORK UNIT</text><text x="1090.0" y="789" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="18" fill="#4f5c68" font-style="italic">exact version + residual uncertainty</text><rect x="520" y="650" width="330" height="170" rx="18" fill="#e3e8ec" stroke="#3d4b58" stroke-width="4"/><text x="685.0" y="707" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="27" fill="#1f2d3d" font-weight="bold">EXECUTION</text><text x="685.0" y="744" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="27" fill="#1f2d3d" font-weight="bold">DOSSIER</text><text x="685.0" y="789" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="18" fill="#4f5c68" font-style="italic">accepted units + conditions</text><rect x="115" y="650" width="330" height="170" rx="18" fill="#e3e8ec" stroke="#3d4b58" stroke-width="4"/><text x="280.0" y="707" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="27" fill="#1f2d3d" font-weight="bold">CHAPTER 6</text><text x="280.0" y="744" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="27" fill="#1f2d3d" font-weight="bold">EVALUATION</text><text x="280.0" y="789" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="18" fill="#4f5c68" font-style="italic">evidence, uncertainty + claim boundary</text><path d="M1290 505 C1240 545 1215 595 1165 640" fill="none" stroke="#284d7a" stroke-width="5" marker-end="url(#arr)"/><line x1="915" y1="735" x2="860" y2="735" stroke="#284d7a" stroke-width="5" marker-end="url(#arr)"/><line x1="510" y1="735" x2="455" y2="735" stroke="#284d7a" stroke-width="5" marker-end="url(#arr)"/><path d="M1420 595 C1330 875 720 900 420 825 C210 775 165 600 245 420 C295 310 420 300 530 300" fill="none" stroke="#687b92" stroke-width="4" stroke-dasharray="13,10" marker-end="url(#arrg)"/><text x="875" y="904" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="25" fill="#52667f" font-style="italic">repair, repeat, return or stop - preserve the reason and the failed state</text><text x="280" y="365" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="20" fill="#52667f" font-style="italic">new evidence may reopen</text><text x="280" y="393" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="20" fill="#52667f" font-style="italic">preparation or an earlier gate</text></svg>