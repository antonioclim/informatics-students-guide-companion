name: finalise-doi-reconciliation
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Install final validation workflow
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          data = base64.b64decode("")
          Path(".github/workflows/validate.yml").write_bytes(data)
          PY
      - run: python scripts/generate_manifest.py
      - run: python scripts/validate_release_candidate.py
      - name: Commit final workflow and refreshed manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate.yml manifests/REPOSITORY_MANIFEST.csv manifests/REPOSITORY_MANIFEST.json manifests/REPOSITORY_SHA256.txt SHA256SUMS.txt
          git commit -m "Refresh manifests after DOI reconciliation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
