" fill="#eaf4eb" stroke="#3b7650" stroke-width="3"/><text x="505" y="626" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="18" fill="#2d5a3e" font-weight="bold">EQUIVALENCE TEST: one study, one verified authorship record, one bounded answer</text><text x="505" y="650" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="15" fill="#2d5a3e" font-style="italic">compression may shorten; it may not strengthen or substitute</text><rect x="970" y="598" width="250" height="64" rx="14" fill="#fff7f6" stroke="#9a3d35" stroke-width="3"/><text x="1095" y="625" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="18" fill="#7b302a" font-weight="bold">DRIFT FOUND?</text><text x="1095" y="650" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="15" fill="#7b302a" font-style="italic">repair the earliest layer</text></svg>