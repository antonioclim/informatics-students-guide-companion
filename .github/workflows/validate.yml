name: validate-public-release
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Refresh deterministic manifests
        run: python scripts/generate_manifest.py
      - name: Validate public release
        run: python scripts/validate_release_candidate.py
      - name: Commit refreshed manifests
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests/REPOSITORY_MANIFEST.csv manifests/REPOSITORY_MANIFEST.json manifests/REPOSITORY_SHA256.txt SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "Manifest files already current."
          else
            git commit -m "Refresh manifests after metadata update"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
