<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="900" viewBox="0 0 1650 900" role="img" aria-labelledby="title desc">
  <title id="title">Gate records to an evidence-governed answer architecture</title>
  <desc id="desc">Three horizontal layers distinguish authorised gate records, a seven-step answer architecture and manuscript section functions. Problem, Evidence, Design, Execution and Claim records feed a central spine running from question through position, route, evidence, result and boundary to contribution. The lower layer shows introduction, knowledge position, method or design, results or findings and discussion or conclusion. A note states that records are sources rather than pre-written chapters and that every reuse must preserve identity and boundary.</desc>
  <defs>
    <style><![CDATA[
      .navy { fill:#203a5d; }
      .red { fill:#8d2727; }
      .bluebox { fill:#e9eff6; stroke:#294f7c; stroke-width:4; }
      .redbox { fill:#fffafa; stroke:#9e2e2e; stroke-width:2.5; }
      .stage { fill:#f4f7fb; stroke:#9e2e2e; stroke-width:4; }
      .note { fill:#ffffff; stroke:#9e2e2e; stroke-width:4; }
      .h1 { font-family:'Times New Roman',serif; font-weight:700; font-size:29px; fill:#203a5d; letter-spacing:.5px; }
      .boxhead { font-family:'Times New Roman',serif; font-weight:700; font-size:28px; fill:#203a5d; }
      .boxsub { font-family:'Times New Roman',serif; font-size:23px; fill:#526d8b; }
      .spinehead { font-family:'Times New Roman',serif; font-weight:700; font-size:20px; fill:#7f2525; }
      .sectionhead { font-family:'Times New Roman',serif; font-weight:700; font-size:23px; fill:#203a5d; }
      .sectionsmall { font-family:'Times New Roman',serif; font-weight:700; font-size:18px; fill:#203a5d; }
      .notemain { font-family:'Times New Roman',serif; font-weight:700; font-size:28px; fill:#7f2525; }
      .notesub { font-family:'Times New Roman',serif; font-style:italic; font-size:22px; fill:#526d8b; }
      .flow { stroke:#2a527e; stroke-width:4; fill:none; }
      .dash { stroke:#6f87a4; stroke-width:3; stroke-dasharray:9 8; fill:none; }
    ]]></style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#2a527e"/></marker>
  </defs>
  <rect width="1650" height="900" fill="#fff"/>
  <text x="825" y="42" text-anchor="middle" class="h1">GATE RECORDS SUPPLY AUTHORISED MATERIAL</text>

  <!-- Gate records -->
  <g>
    <rect x="29" y="73" width="297" height="118" rx="18" class="bluebox"/>
    <text x="177.5" y="122" text-anchor="middle" class="boxhead">PROBLEM</text>
    <text x="177.5" y="164" text-anchor="middle" class="boxsub">question · scope</text>
    <path d="M177.5 192 L177.5 244" class="dash" marker-end="url(#arrow)"/>

    <rect x="352" y="73" width="297" height="118" rx="18" class="bluebox"/>
    <text x="500.5" y="122" text-anchor="middle" class="boxhead">EVIDENCE</text>
    <text x="500.5" y="164" text-anchor="middle" class="boxsub">corpus · position</text>
    <path d="M500.5 192 L500.5 244" class="dash" marker-end="url(#arrow)"/>

    <rect x="676" y="73" width="297" height="118" rx="18" class="bluebox"/>
    <text x="824.5" y="122" text-anchor="middle" class="boxhead">DESIGN</text>
    <text x="824.5" y="164" text-anchor="middle" class="boxsub">method · rationale</text>
    <path d="M824.5 192 L824.5 244" class="dash" marker-end="url(#arrow)"/>

    <rect x="999" y="73" width="297" height="118" rx="18" class="bluebox"/>
    <text x="1147.5" y="122" text-anchor="middle" class="boxhead">EXECUTION</text>
    <text x="1147.5" y="164" text-anchor="middle" class="boxsub">state · provenance</text>
    <path d="M1147.5 192 L1147.5 244" class="dash" marker-end="url(#arrow)"/>

    <rect x="1323" y="73" width="297" height="118" rx="18" class="bluebox"/>
    <text x="1471.5" y="122" text-anchor="middle" class="boxhead">CLAIM</text>
    <text x="1471.5" y="164" text-anchor="middle" class="boxsub">answer · limits</text>
    <path d="M1471.5 192 L1471.5 244" class="dash" marker-end="url(#arrow)"/>
  </g>

  <!-- Answer architecture -->
  <rect x="42" y="267" width="1566" height="172" rx="24" class="stage"/>
  <text x="825" y="303" text-anchor="middle" style="font-family:'Times New Roman',serif;font-weight:700;font-size:28px;fill:#8d2727">ANSWER ARCHITECTURE</text>
  <g>
    <rect x="76" y="333" width="178" height="74" rx="13" class="redbox"/><text x="165" y="378" text-anchor="middle" class="spinehead">QUESTION</text>
    <path d="M258 370 L288 370" class="flow" marker-end="url(#arrow)"/>
    <rect x="297" y="333" width="178" height="74" rx="13" class="redbox"/><text x="386" y="378" text-anchor="middle" class="spinehead">POSITION</text>
    <path d="M479 370 L509 370" class="flow" marker-end="url(#arrow)"/>
    <rect x="519" y="333" width="178" height="74" rx="13" class="redbox"/><text x="608" y="378" text-anchor="middle" class="spinehead">ROUTE</text>
    <path d="M701 370 L731 370" class="flow" marker-end="url(#arrow)"/>
    <rect x="741" y="333" width="178" height="74" rx="13" class="redbox"/><text x="830" y="378" text-anchor="middle" class="spinehead">EVIDENCE</text>
    <path d="M923 370 L953 370" class="flow" marker-end="url(#arrow)"/>
    <rect x="963" y="333" width="178" height="74" rx="13" class="redbox"/><text x="1052" y="378" text-anchor="middle" class="spinehead">RESULT</text>
    <path d="M1145 370 L1175 370" class="flow" marker-end="url(#arrow)"/>
    <rect x="1185" y="333" width="178" height="74" rx="13" class="redbox"/><text x="1274" y="378" text-anchor="middle" class="spinehead">BOUNDARY</text>
    <path d="M1367 370 L1397 370" class="flow" marker-end="url(#arrow)"/>
    <rect x="1407" y="333" width="178" height="74" rx="13" class="redbox"/><text x="1496" y="378" text-anchor="middle" class="spinehead">CONTRIBUTION</text>
  </g>

  <text x="825" y="483" text-anchor="middle" class="h1">MANUSCRIPT SECTIONS PERFORM INTELLECTUAL WORK</text>
  <path d="M177.5 439 L177.5 452" class="flow"/>
  <path d="M177.5 505 L177.5 548" class="flow" marker-end="url(#arrow)"/>
  <path d="M500.5 439 L500.5 452" class="flow"/>
  <path d="M500.5 505 L500.5 548" class="flow" marker-end="url(#arrow)"/>
  <path d="M824.5 439 L824.5 452" class="flow"/>
  <path d="M824.5 505 L824.5 548" class="flow" marker-end="url(#arrow)"/>
  <path d="M1147.5 439 L1147.5 452" class="flow"/>
  <path d="M1147.5 505 L1147.5 548" class="flow" marker-end="url(#arrow)"/>
  <path d="M1471.5 439 L1471.5 452" class="flow"/>
  <path d="M1471.5 505 L1471.5 548" class="flow" marker-end="url(#arrow)"/>

  <!-- Manuscript sections -->
  <g>
    <rect x="29" y="554" width="297" height="138" rx="18" class="bluebox"/>
    <text x="177.5" y="608" text-anchor="middle" class="sectionhead">INTRODUCTION</text>
    <text x="177.5" y="654" text-anchor="middle" class="boxsub">problem · promise</text>

    <rect x="352" y="554" width="297" height="138" rx="18" class="bluebox"/>
    <text x="500.5" y="608" text-anchor="middle" class="sectionhead">KNOWLEDGE POSITION</text>
    <text x="500.5" y="654" text-anchor="middle" class="boxsub">synthesis · gap</text>

    <rect x="676" y="554" width="297" height="138" rx="18" class="bluebox"/>
    <text x="824.5" y="608" text-anchor="middle" class="sectionhead">METHOD / DESIGN</text>
    <text x="824.5" y="654" text-anchor="middle" class="boxsub">route · execution</text>

    <rect x="999" y="554" width="297" height="138" rx="18" class="bluebox"/>
    <text x="1147.5" y="608" text-anchor="middle" class="sectionhead">RESULTS / FINDINGS</text>
    <text x="1147.5" y="654" text-anchor="middle" class="boxsub">observations · uncertainty</text>

    <rect x="1323" y="554" width="297" height="138" rx="18" class="bluebox"/>
    <text x="1471.5" y="605" text-anchor="middle" class="sectionsmall">DISCUSSION / CONCLUSION</text>
    <text x="1471.5" y="654" text-anchor="middle" class="boxsub">meaning · boundary</text>
  </g>

  <rect x="131" y="706" width="1388" height="132" rx="20" class="note"/>
  <text x="825" y="756" text-anchor="middle" class="notemain">Records are sources, not pre-written chapters.</text>
  <text x="825" y="805" text-anchor="middle" class="notesub">One record may support several sections, but every reuse preserves identity and boundary.</text>
</svg>
